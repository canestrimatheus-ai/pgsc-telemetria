<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Senha · PGCSC Telemetria | Expresso Nepomuceno</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            background-color: #070e17;
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
        }

        .ambient-glow {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }
        .glow-circle {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(26, 86, 219, 0.22) 0%, rgba(26, 86, 219, 0) 70%);
            filter: blur(90px);
            border-radius: 50%;
        }

        .auth-card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            background: rgba(13, 27, 42, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 36px 32px;
            box-shadow: 0 20px 45px -10px rgba(0, 0, 0, 0.6);
            animation: fadeIn 0.35s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .brand-header {
            text-align: center;
            margin-bottom: 24px;
        }
        .brand-logo {
            height: 36px;
            width: auto;
            margin-bottom: 12px;
        }
        .brand-title {
            font-size: 19px;
            font-weight: 800;
            color: #ffffff;
        }
        .brand-subtitle {
            font-size: 13px;
            color: #94a3b8;
            margin-top: 4px;
        }
        .user-tag {
            display: inline-block;
            margin-top: 8px;
            padding: 4px 12px;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.25);
            border-radius: 999px;
            font-size: 12px;
            color: #38bdf8;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 16px;
        }
        .form-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 6px;
        }
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .input-icon {
            position: absolute;
            left: 14px;
            color: #64748b;
            font-size: 14px;
            pointer-events: none;
        }
        .form-control {
            width: 100%;
            height: 44px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 0 40px 0 40px;
            font-family: inherit;
            font-size: 13.5px;
            color: #ffffff;
            outline: none;
            transition: all 0.2s ease;
        }
        .form-control:focus {
            border-color: #3b82f6;
            background: rgba(15, 23, 42, 0.85);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }
        .password-toggle {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            color: #64748b;
            cursor: pointer;
            font-size: 15px;
            padding: 4px;
        }
        .password-toggle:hover {
            color: #cbd5e1;
        }

        .btn-submit {
            width: 100%;
            height: 44px;
            background: linear-gradient(135deg, #1a56db 0%, #1545b5 100%);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            font-family: inherit;
            font-size: 13.5px;
            font-weight: 700;
            color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 14px rgba(26, 86, 219, 0.4);
            transition: all 0.2s ease;
            margin-top: 12px;
        }
        .btn-submit:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(26, 86, 219, 0.5);
            background: linear-gradient(135deg, #2563eb 0%, #1a56db 100%);
        }

        .alert-box {
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 12.5px;
            line-height: 1.4;
            margin-bottom: 18px;
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }
        .alert-box.error {
            background: rgba(220, 38, 38, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #ffffff;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="ambient-glow">
        <div class="glow-circle"></div>
    </div>

    <div class="auth-card">
        <div class="brand-header">
            <img src="{{ url_for('static', filename='img/logo_nepomuceno_negativo.png') }}" alt="Expresso Nepomuceno" class="brand-logo" onerror="this.style.display='none'">
            <h1 class="brand-title">Cadastrar Senha de Acesso</h1>
            <p class="brand-subtitle">Crie sua senha corporativa para entrar na plataforma</p>
            <div class="user-tag">{{ user.nome }} • {{ user.email }}</div>
        </div>

        <form id="form-setup" onsubmit="handleSetupPassword(event)">
            <div class="form-group">
                <label class="form-label" for="new-pw">Nova Senha</label>
                <div class="input-wrapper">
                    <span class="input-icon">🔒</span>
                    <input type="password" id="new-pw" class="form-control" placeholder="Mínimo 6 caracteres" required minlength="6" autocomplete="new-password">
                    <button type="button" class="password-toggle" onclick="togglePasswordVisibility('new-pw')">👁️</button>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="confirm-pw">Confirmar Nova Senha</label>
                <div class="input-wrapper">
                    <span class="input-icon">🔒</span>
                    <input type="password" id="confirm-pw" class="form-control" placeholder="Repita a nova senha" required minlength="6" autocomplete="new-password">
                    <button type="button" class="password-toggle" onclick="togglePasswordVisibility('confirm-pw')">👁️</button>
                </div>
            </div>

            <div class="alert-box error" id="setup-error" style="display: none;"></div>

            <button type="submit" class="btn-submit" id="btn-submit">
                <span id="btn-submit-text">Salvar Senha & Acessar Sistema</span>
                <div class="spinner" id="btn-submit-spinner" style="display: none;"></div>
            </button>
        </form>
    </div>

    <script>
        const API_PREFIX = "{{ request.script_root }}";
        const TOKEN = "{{ token }}";

        function togglePasswordVisibility(id) {
            const el = document.getElementById(id);
            el.type = (el.type === 'password') ? 'text' : 'password';
        }

        async function handleSetupPassword(e) {
            e.preventDefault();
            const pw = document.getElementById('new-pw').value;
            const confirm = document.getElementById('confirm-pw').value;
            const btn = document.getElementById('btn-submit');
            const btnText = document.getElementById('btn-submit-text');
            const spinner = document.getElementById('btn-submit-spinner');
            const errEl = document.getElementById('setup-error');

            if (pw !== confirm) {
                errEl.textContent = '⚠️ As senhas digitadas não coincidem.';
                errEl.style.display = 'flex';
                return;
            }

            if (pw.length < 6) {
                errEl.textContent = '⚠️ A senha deve ter no mínimo 6 caracteres.';
                errEl.style.display = 'flex';
                return;
            }

            errEl.style.display = 'none';
            btn.disabled = true;
            btnText.style.display = 'none';
            spinner.style.display = 'inline-block';

            try {
                const res = await fetch(API_PREFIX + '/api/auth/setup-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: TOKEN, password: pw })
                });
                const data = await res.json();
                if (!res.ok) {
                    throw new Error(data.error || 'Erro ao definir senha.');
                }
                window.location.href = API_PREFIX + '/';
            } catch (err) {
                errEl.textContent = '⚠️ ' + err.message;
                errEl.style.display = 'flex';
                btn.disabled = false;
                btnText.style.display = 'inline';
                spinner.style.display = 'none';
            }
        }
    </script>
</body>
</html>
